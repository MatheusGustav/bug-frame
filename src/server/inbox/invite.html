<!doctype html><html lang="{{LANG}}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title data-i18n="inviteTitle">{{T:inviteTitle}}</title><link rel="stylesheet" href="{{BASE}}/inbox.css"><script src="{{BASE}}/invite.js" type="module"></script></head>
<body data-config="{{CONFIG}}"><main class="invitation"><section><div class="language-control"><label for="language" data-i18n="language">{{T:language}}</label><select id="language"><option value="en"{{SEL:en}}>English</option><option value="es"{{SEL:es}}>Español</option><option value="pt"{{SEL:pt}}>Português</option></select></div><p class="eyebrow" data-i18n="inviteEyebrow">{{T:inviteEyebrow}}</p><h1>{{NAME}}</h1><p data-i18n="inviteIntro">{{T:inviteIntro}}</p><p data-i18n="inviteSignInHelp">{{T:inviteSignInHelp}}</p><p id="message" role="status" aria-live="polite"></p><p id="sign-in" hidden><a id="login" target="_blank" rel="noopener noreferrer" data-i18n="signInTab">{{T:signInTab}}</a>. <span data-i18n="returnToAccept">{{T:returnToAccept}}</span></p><button id="accept" type="button" data-i18n="acceptInvite">{{T:acceptInvite}}</button><p id="next" hidden><a id="start" data-i18n="reviewSite">{{T:reviewSite}}</a> · <a id="requests" data-i18n="requestsLink">{{T:requestsLink}}</a></p></section></main></body></html>
