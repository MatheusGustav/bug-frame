<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bugframe demo page</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 24px; background: #f6f7fb; color: #14171f; }
    main { max-width: 720px; margin: 0 auto; display: grid; gap: 16px; }
    .card { background: #fff; border: 1px solid #d5dbe6; border-radius: 12px; padding: 16px; }
    h1 { margin-top: 0; }
    #total { font-size: 28px; font-weight: 700; }
    button, input { font: inherit; padding: 8px 12px; }
    .chat-bubble { position: fixed; right: 16px; bottom: 16px; width: 56px; height: 56px; border-radius: 50%; background: #2563eb; color: #fff; border: 0; }
  </style>
</head>
<body>
  <main>
    <!-- BUGFRAME_SESSION -->
    <section class="card" data-component="invoice-summary">
      <h1>Invoice #4021</h1>
      <p>Total due: <span id="total">$1,240.00</span></p>
      <p>This number is wrong on purpose. Try reporting it.</p>
    </section>
    <section class="card" data-component="login-form">
      <label>Email <input id="email" type="email" value="person@example.com"></label>
      <label>Password <input id="password" type="password" value="hunter2-not-real"></label>
      <p>Account number: <b data-bug-mask id="acct">0000 1111 2222</b> (marked with <code>data-bug-mask</code>)</p>
    </section>
    <section class="card">
      <button id="boom" type="button">Log a console error</button>
    </section>
  </main>
  <button class="chat-bubble" id="chat" type="button" aria-label="Chat">?</button>

  <!-- 1) Script-tag use. Open this page with ?bugs=1 to turn the tool on (it then stays on until ?bugs=0). -->
  <script>
    document.getElementById('boom').addEventListener('click', function () { console.error('Demo error: total could not be loaded'); });
  </script>
  <!-- BUGFRAME_WIDGET -->

  <!-- 2) The same thing with full control:
  <script src="/bugframe.min.js"></script>
  <script>
    Bugframe.init({
      endpoint: '/api/bugframe', position: 'bottom-right', avoid: ['#chat'],
      types: ['Wrong layout', 'Missing', 'Wrong data', 'Broken', 'Text'], captureConsole: true,
      metadata: function () { return { appVersion: '1.4.2', plan: 'pro' }; },
    });
  </script> -->
</body>
</html>
